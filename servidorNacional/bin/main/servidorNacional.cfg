# ========================================
# CONFIGURACIÓN SERVIDOR NACIONAL
# Sistema de Votación - ZeroC ICE - RÁPIDO
# ========================================

# ========== CONFIGURACIÓN ICE ==========
Ice.Default.Locator=DemoIceGrid/Locator:default -h localhost -p 4061

# Adaptador principal del servidor nacional
ServidorNacionalAdapter.Endpoints=tcp -h localhost -p 9090

# ========== CONFIGURACIÓN BASE DE DATOS ==========
# Configuración PostgreSQL para ConsultaMesa
db.host=10.147.17.110
db.port=5432
db.name=elecciones_grajj
db.user=votaciones_grajj
db.password=votaciones_grajj

# Pool de conexiones
db.pool.minSize=5
db.pool.maxSize=5
db.pool.timeout=30000

# === CONFIGURACIÓN DE ESTABILIDAD DE CONEXIONES ===
# Configuración para evitar que las conexiones se caigan
db.connection.keepAlive=true
db.connection.tcpKeepAlive=true
db.connection.socketTimeout=300000
db.connection.loginTimeout=30
db.connection.connectTimeout=15000

# Validación de conexiones
db.connection.testOnBorrow=true
db.connection.testOnReturn=true
db.connection.testWhileIdle=true
db.connection.validationQuery=SELECT 1
db.connection.validationTimeout=5000

# Configuración de idle connections
db.connection.maxIdleTime=600000
db.connection.idleConnectionTestPeriod=60000
db.connection.maxConnectionAge=3600000

# Configuración de reintentos
db.retry.maxAttempts=5
db.retry.delayMs=1000
db.retry.backoffMultiplier=2.0

# === CONFIGURACIÓN DE MONITOREO DE CONEXIONES ===
# Intervalo para verificar conexiones (milisegundos)
db.monitor.healthCheckInterval=30000

# Timeout para health checks
db.monitor.healthCheckTimeout=5000

# Reconexión automática habilitada
db.monitor.autoReconnect=true

# === CONFIGURACIÓN DE POSTGRESQL ESPECÍFICA ===
# Configuraciones específicas para PostgreSQL
db.postgresql.tcpKeepAlive=true
db.postgresql.socketTimeout=300
db.postgresql.loginTimeout=30
db.postgresql.connectTimeout=15
db.postgresql.cancelSignalTimeout=10
db.postgresql.socketFactory=
db.postgresql.sslfactory=
db.postgresql.ssl=false
db.postgresql.sslmode=disable

# ========== CONFIGURACIÓN CONSULTA MESA ==========
# Tiempo de espera para consultas (ms)
consultaMesa.queryTimeout=15000

# Mensaje de servicio inactivo
consultaMesa.serviceInactiveMessage=🚫 SERVICIO TEMPORALMENTE INACTIVO\n   📞 Contacte a soporte técnico\n   📧 soporte@sistemavotacion.gov.co\n   📱 Línea: 01-8000-VOTO (8686)

# ========== CONFIGURACIÓN HELLO WORLD ==========
helloWorld.serverName=Servidor Nacional - Sistema de Votación
helloWorld.version=1.0.0

# ========== CONFIGURACIÓN BROKER ==========
# Configuración del patrón Broker
broker.scalingThreshold=0.5
broker.maxReplicas=5
broker.minReplicas=1

# ========== CONFIGURACIÓN DE LOGGING ==========
# Nivel de logging (DEBUG, INFO, WARN, ERROR)
logging.level=INFO
logging.showTimestamp=true
logging.showThreadName=false

# Logging de conexiones para debugging
db.logging.enabled=true
db.logging.logConnections=true
db.logging.logDisconnections=true
db.logging.logSlowQueries=true
db.logging.slowQueryThreshold=5000

# ========== CONFIGURACIÓN DE MONITOREO ==========
# Intervalo de monitoreo de recursos (ms)
monitor.resourceCheckInterval=5000

# Métricas habilitadas
monitor.enableCpuMetrics=true
monitor.enableMemoryMetrics=true
monitor.enableNetworkMetrics=true

# ========== CONFIGURACIÓN DE SEGURIDAD ==========
# Timeout para conexiones (ms)
security.connectionTimeout=10000

# Máximo número de conexiones concurrentes
security.maxConcurrentConnections=100 