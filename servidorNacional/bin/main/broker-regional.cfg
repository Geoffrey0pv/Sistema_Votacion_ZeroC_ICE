# ========================================
# CONFIGURACIÓN BROKER REGIONAL
# Sistema de Votación - ZeroC ICE
# ========================================

# ========== CONFIGURACIÓN DE RED ==========
# Host y puerto del broker regional
broker.host=0.0.0.0
broker.port=8080
broker.endpoints=tcp -h 0.0.0.0 -p 8080

# ========== CONFIGURACIÓN DE RÉPLICAS ==========
# Configuración de réplicas para escalado automático
replica.minReplicas=1
replica.maxReplicas=8
replica.basePort=11000
replica.hostPattern=0.0.0.0
replica.autoScaling=true

# Lista de hosts disponibles para réplicas regionales
# Ejemplo para múltiples computadores regionales:
# replica.hosts=192.168.2.100,192.168.2.101,192.168.2.102
replica.hosts=10.147.17.113

# ========== CONFIGURACIÓN DE ESCALADO ==========
# Umbrales para escalado automático (más conservadores que nacional)
scaling.cpuThreshold=60.0
scaling.memoryThreshold=70.0
scaling.scaleUpThreshold=65.0
scaling.scaleDownThreshold=20.0

# Intervalos de evaluación y enfriamiento (milisegundos)
scaling.evaluationInterval=45000
scaling.cooldownPeriod=90000

# ========== CONFIGURACIÓN DE BALANCEADOR ==========
# Algoritmo de balanceo optimizado para regionales
loadBalancer.algorithm=LEAST_CONNECTIONS
loadBalancer.healthCheckInterval=20000
loadBalancer.maxFailures=2
loadBalancer.failureTimeout=45000

# ========== CONFIGURACIÓN DE MONITOREO ==========
# Intervalos de monitoreo (menos frecuente que nacional)
monitor.metricsInterval=15000
monitor.resourceCheckInterval=7500
monitor.enableDetailedMetrics=false

# ========== CONFIGURACIÓN DE CLUSTER ==========
# Nombre del cluster regional
cluster.name=regional-cluster
cluster.discovery.enabled=true
cluster.discovery.port=7947
cluster.heartbeat.interval=7500

# ========== CONFIGURACIÓN ESPECÍFICA REGIONAL ==========
# Conexión al servidor nacional
regional.nacionalEndpoint=tcp -h 10.147.17.113 -p 9090
regional.mesasPort=12000
regional.maxMesas=100

# Configuración de sincronización con nacional
regional.syncInterval=60000
regional.syncTimeout=30000
regional.syncRetries=3

# ========== CONFIGURACIÓN PARA MÚLTIPLES COMPUTADORES ==========
# Configuración de red para despliegue distribuido regional
network.bindAddress=0.0.0.0
network.publicAddress=auto
network.maxConnections=150
network.connectionTimeout=12000

# Configuración de descubrimiento de nodos regionales
discovery.multicast.enabled=true
discovery.multicast.address=224.0.0.2
discovery.multicast.port=7947
discovery.broadcast.enabled=true
discovery.broadcast.port=7948

# ========== CONFIGURACIÓN DE ALTA DISPONIBILIDAD ==========
# Configuración de failover regional
failover.enabled=true
failover.electionTimeout=20000
failover.leaderHeartbeat=7500
failover.backupNodes=1

# Configuración de persistencia regional
persistence.enabled=true
persistence.snapshotInterval=600000
persistence.logRetention=43200000

# ========== CONFIGURACIÓN DE MESAS DE VOTACIÓN ==========
# Configuración para gestión de mesas
mesa.maxConcurrentConnections=50
mesa.connectionTimeout=10000
mesa.heartbeatInterval=30000
mesa.maxInactivePeriod=300000

# Pool de puertos para mesas
mesa.portRange.start=12000
mesa.portRange.end=12999

# ========== CONFIGURACIÓN DE SEGURIDAD ==========
# Configuración de seguridad regional
security.enabled=false
security.keystore=
security.password=
security.allowedHosts=*
security.mesaAuthentication=false

# ========== CONFIGURACIÓN DE RENDIMIENTO ==========
# Configuración de hilos optimizada para regional
threading.corePoolSize=5
threading.maxPoolSize=25
threading.queueCapacity=500
threading.keepAliveTime=60000

# Configuración de cache regional
cache.enabled=true
cache.maxSize=5000
cache.ttl=600000

# ========== CONFIGURACIÓN DE LOGGING ==========
# Configuración de logs regional
logging.level=INFO
logging.enableDistributedTracing=true
logging.nodeIdInLogs=true
logging.metricsLogging=false
logging.mesaLogging=true

# ========== CONFIGURACIÓN DE TOLERANCIA A FALLOS ==========
# Configuración específica para manejo de fallos regionales
fault.tolerance.enabled=true
fault.tolerance.maxRetries=5
fault.tolerance.retryDelay=2000
fault.tolerance.circuitBreakerThreshold=10
fault.tolerance.circuitBreakerTimeout=60000 