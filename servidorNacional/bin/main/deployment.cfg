# ========================================
# CONFIGURACIÓN DE DESPLIEGUE
# Sistema de Votación ZeroC ICE
# ========================================

# ========== CONFIGURACIÓN GENERAL ==========
deployment.mode=development
deployment.environment=local
deployment.version=1.0.0
deployment.description=Sistema de Votación Distribuido con Broker

# ========== CONFIGURACIÓN DE DESARROLLO ==========
development.autoStart=true
development.debugMode=true
development.hotReload=true
development.mockData=true
development.verboseLogging=true
development.skipSecurity=true
development.fastStartup=true

# ========== CONFIGURACIÓN DE TESTING ==========
testing.parallelExecution=true
testing.mockExternalServices=true
testing.cleanupAfterTests=true
testing.isolatedTests=true
testing.timeoutMultiplier=2.0
testing.maxRetries=3

# ========== CONFIGURACIÓN DE STAGING ==========
staging.securityEnabled=true
staging.monitoringEnabled=true
staging.loggingLevel=INFO
staging.performanceOptimized=false
staging.debugMode=false

# ========== CONFIGURACIÓN DE PRODUCCIÓN ==========
production.securityEnabled=true
production.monitoringEnabled=true
production.loggingLevel=WARN
production.performanceOptimized=true
production.debugMode=false
production.hotReload=false
production.mockData=false
production.verboseLogging=false

# ========== CONFIGURACIÓN DE RED ==========
# Hosts por defecto (se pueden sobrescribir por escenario)
nacional.host=localhost
nacional.port=9090
nacional.backupPort=9091

regional.host=localhost
regional.port=8080
regional.backupPort=8081

cluster.port=7947
cluster.multicastPort=7948

# ========== CONFIGURACIÓN DE ESCENARIOS ==========

# Escenario: Desarrollo Local
scenario.local-development.enabled=true
scenario.local-development.nacional.host=localhost
scenario.local-development.nacional.port=9090
scenario.local-development.regional.host=localhost
scenario.local-development.regional.port=8080
scenario.local-development.cluster.seeds=localhost:7947

# Escenario: Red Local (LAN)
scenario.lan-deployment.enabled=false
scenario.lan-deployment.nacional.host=192.168.1.100
scenario.lan-deployment.nacional.port=9090
scenario.lan-deployment.regional.hosts=192.168.1.101,192.168.1.102,192.168.1.103
scenario.lan-deployment.regional.port=8080
scenario.lan-deployment.cluster.seeds=192.168.1.100:7947,192.168.1.101:7947,192.168.1.102:7947

# Escenario: Cloud/VPS
scenario.cloud-deployment.enabled=false
scenario.cloud-deployment.nacional.host=203.0.113.10
scenario.cloud-deployment.nacional.port=9090
scenario.cloud-deployment.regional.hosts=203.0.113.11,203.0.113.12
scenario.cloud-deployment.regional.port=8080
scenario.cloud-deployment.security.enabled=true
scenario.cloud-deployment.firewall.enabled=true

# Escenario: Híbrido
scenario.hybrid-deployment.enabled=false
scenario.hybrid-deployment.nacional.host=203.0.113.10
scenario.hybrid-deployment.nacional.port=9090
scenario.hybrid-deployment.regional.hosts=192.168.1.101,192.168.2.101,192.168.3.101
scenario.hybrid-deployment.vpn.enabled=true
scenario.hybrid-deployment.nat.traversal=true

# Escenario: Alta Disponibilidad
scenario.high-availability.enabled=false
scenario.high-availability.nacional.hosts=10.0.0.10,10.0.0.11,10.0.0.12
scenario.high-availability.nacional.port=9090
scenario.high-availability.loadBalancer.enabled=true
scenario.high-availability.failover.enabled=true
scenario.high-availability.replication.factor=3

# ========== CONFIGURACIÓN DE BROKER ==========
broker.nacional.enabled=true
broker.nacional.autoScale=true
broker.nacional.minReplicas=1
broker.nacional.maxReplicas=5

broker.regional.enabled=true
broker.regional.autoScale=true
broker.regional.minReplicas=1
broker.regional.maxReplicas=3

# ========== CONFIGURACIÓN DE MONITOREO ==========
monitoring.enabled=true
monitoring.interval=30000
monitoring.metricsEnabled=true
monitoring.healthCheckEnabled=true
monitoring.alertsEnabled=false

# ========== CONFIGURACIÓN DE LOGGING ==========
logging.level=INFO
logging.file.enabled=true
logging.file.path=logs/deployment.log
logging.console.enabled=true
logging.distributed.enabled=false

# ========== CONFIGURACIÓN DE SEGURIDAD ==========
security.enabled=false
security.authentication.enabled=false
security.encryption.enabled=false
security.certificates.path=certs/

# ========== CONFIGURACIÓN DE PERFORMANCE ==========
performance.threadPool.size=10
performance.connectionPool.size=20
performance.cache.enabled=true
performance.cache.size=1000
performance.compression.enabled=false

# ========== CONFIGURACIÓN DE FAILOVER ==========
failover.enabled=true
failover.timeout=30000
failover.maxRetries=3
failover.backoffMultiplier=2.0

# ========== CONFIGURACIÓN DE PERSISTENCIA ==========
persistence.enabled=true
persistence.snapshotInterval=300000
persistence.logRetention=7
persistence.backupEnabled=false

# ========== CONFIGURACIÓN DE DOCKER ==========
docker.enabled=false
docker.network=sistema-votacion-network
docker.compose.version=3.8

# ========== CONFIGURACIÓN DE KUBERNETES ==========
kubernetes.enabled=false
kubernetes.namespace=sistema-votacion
kubernetes.replicas=1
kubernetes.resources.requests.cpu=100m
kubernetes.resources.requests.memory=256Mi
kubernetes.resources.limits.cpu=500m
kubernetes.resources.limits.memory=512Mi

# ========== CONFIGURACIÓN DE DESARROLLO AVANZADO ==========
dev.hotReload.watchPaths=src/main/java
dev.hotReload.excludePatterns=*.class,*.jar
dev.mockData.candidatos=5
dev.mockData.mesas=10
dev.mockData.votos=100

# ========== CONFIGURACIÓN DE TESTING AVANZADO ==========
test.integration.enabled=true
test.load.enabled=false
test.load.users=100
test.load.duration=300
test.coverage.enabled=true
test.coverage.threshold=80

# ========== CONFIGURACIÓN DE MÉTRICAS ==========
metrics.enabled=true
metrics.interval=60000
metrics.export.prometheus=false
metrics.export.graphite=false
metrics.export.console=true

# ========== CONFIGURACIÓN DE ALERTAS ==========
alerts.enabled=false
alerts.email.enabled=false
alerts.slack.enabled=false
alerts.webhook.enabled=false

# ========== CONFIGURACIÓN DE BACKUP ==========
backup.enabled=false
backup.interval=86400000
backup.retention=30
backup.compression=true
backup.encryption=false

# ========== CONFIGURACIÓN EXPERIMENTAL ==========
experimental.features.enabled=false
experimental.newLoadBalancer=false
experimental.advancedMetrics=false
experimental.autoTuning=false 