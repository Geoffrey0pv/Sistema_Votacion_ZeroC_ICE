# Configuración de Base de Datos - Sistema de Votación
# Archivo: database.properties
# Versión: 1.0

# Configuración de PostgreSQL
database.url=jdbc:postgresql://x104m01.inf.udec.cl:5432/votacion
database.username=votacion_user
database.password=votacion_pass
database.driver=org.postgresql.Driver

# Configuración del Pool de Conexiones
database.pool.minSize=2
database.pool.maxSize=10
database.pool.timeout=30000

# Configuración de Consultas
database.query.timeout=15000
database.connection.timeout=10000

# Configuración de Logging
database.logging.enabled=true
database.logging.level=INFO

# Configuración de Reintentos
database.retry.maxAttempts=3
database.retry.delay=1000 