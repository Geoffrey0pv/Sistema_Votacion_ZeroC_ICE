# Configuración de Base de Datos de Votos y Candidatos
# Sistema de Votación ZeroC ICE - CONFIGURACIÓN RÁPIDA

# === CONFIGURACIÓN DE BASE DE DATOS ===
db.host=10.147.17.110
db.port=5432
db.name=votos_elecciones_grajj
db.user=votaciones_grajj
db.password=votaciones_grajj

# === CONFIGURACIÓN BÁSICA DE REINTENTOS ===
db.retry.maxAttempts=3
db.retry.delayMs=500
db.retry.backoffMultiplier=1.5

# === CONFIGURACIÓN DE POOL DE CONEXIONES ===
# Número mínimo de conexiones en el pool
db.pool.minSize=5

# Número máximo de conexiones en el pool
db.pool.maxSize=20

# Timeout para obtener conexión del pool (milisegundos)
db.pool.timeout=30000

# === CONFIGURACIÓN DE ESTABILIDAD DE CONEXIONES ===
# Configuración para evitar que las conexiones se caigan
db.connection.keepAlive=true
db.connection.tcpKeepAlive=true
db.connection.socketTimeout=300000
db.connection.loginTimeout=30
db.connection.connectTimeout=15000

# Validación de conexiones
db.connection.testOnBorrow=true
db.connection.testOnReturn=true
db.connection.testWhileIdle=true
db.connection.validationQuery=SELECT 1
db.connection.validationTimeout=5000

# Configuración de idle connections
db.connection.maxIdleTime=600000
db.connection.idleConnectionTestPeriod=60000
db.connection.maxConnectionAge=3600000

# === CONFIGURACIÓN DE MONITOREO DE CONEXIONES ===
# Intervalo para verificar conexiones (milisegundos)
db.monitor.healthCheckInterval=30000

# Timeout para health checks
db.monitor.healthCheckTimeout=5000

# Reconexión automática habilitada
db.monitor.autoReconnect=true

# === CONFIGURACIÓN DE POSTGRESQL ESPECÍFICA ===
# Configuraciones específicas para PostgreSQL
db.postgresql.tcpKeepAlive=true
db.postgresql.socketTimeout=300
db.postgresql.loginTimeout=30
db.postgresql.connectTimeout=15
db.postgresql.cancelSignalTimeout=10
db.postgresql.socketFactory=
db.postgresql.sslfactory=
db.postgresql.ssl=false
db.postgresql.sslmode=disable

# === CONFIGURACIÓN DE LOGGING ===
# Logging de conexiones para debugging
db.logging.enabled=true
db.logging.logConnections=true
db.logging.logDisconnections=true
db.logging.logSlowQueries=true
db.logging.slowQueryThreshold=5000 