# Configuración de Base de Datos de Votos y Candidatos
# Sistema de Votación ZeroC ICE

# === CONFIGURACIÓN DE BASE DE DATOS ===
votos.db.host=10.147.17.101
votos.db.port=5432
votos.db.name=votos_elecciones_grajj
votos.db.user=votaciones_grajj
votos.db.password=votaciones_grajj

# === CONFIGURACIÓN DE POOL DE CONEXIONES ===
# Número mínimo de conexiones en el pool
votos.db.pool.minSize=5

# Número máximo de conexiones en el pool
votos.db.pool.maxSize=50

# Timeout para obtener conexión del pool (milisegundos)
votos.db.pool.timeout=30000

# === CONFIGURACIÓN DE REINTENTOS ===
# Número máximo de intentos para operaciones fallidas
votos.db.retry.maxAttempts=3

# Delay inicial entre reintentos (milisegundos)
votos.db.retry.delayMs=2000

# Factor de multiplicación para backoff exponencial
votos.db.retry.backoffMultiplier=2.0 