# =====================================================
# CONFIGURACIÓN CENTRALIZADA DE HOSTS Y NETWORKING
# =====================================================
# Este archivo centraliza todas las configuraciones de host
# para reemplazar los valores hardcodeados de "localhost"

# ===== CONFIGURACIÓN PRINCIPAL =====
# Host principal para el servidor nacional
nacional.host=localhost
nacional.port=9090

# Host para servidores regionales
regional.host=localhost
regional.port=8080

# ===== CONFIGURACIÓN DE REPLICAS =====
# Host base para réplicas
replica.host=localhost
replica.base_port=10000
replica.max_replicas=10

# ===== CONFIGURACIÓN DE BROKER =====
# Host del broker nacional
broker.nacional.host=localhost
broker.nacional.port=9090

# Host del broker regional
broker.regional.host=localhost
broker.regional.port=8080

# Endpoint del broker nacional para regionales
broker.nacional.endpoint=tcp -h localhost -p 9090

# ===== CONFIGURACIÓN DE ICE GRID =====
# Localizador de Ice Grid
ice.locator.host=localhost
ice.locator.port=4061

# ===== CONFIGURACIÓN DE CLUSTER =====
# Semillas del cluster para descubrimiento
cluster.seeds=localhost:7947

# ===== CONFIGURACIÓN DE RED =====
# Hostname local por defecto
network.local.hostname=localhost

# IP local por defecto (se puede autodetectar)
network.local.ip=127.0.0.1

# ===== CONFIGURACIÓN DE DESARROLLO =====
# Configuración específica para desarrollo local
dev.nacional.host=localhost
dev.regional.host=localhost
dev.cluster.seeds=localhost:7947

# ===== CONFIGURACIÓN DE ENDPOINTS =====
# Adaptador del servidor nacional
nacional.adapter.endpoints=tcp -h localhost -p 9090

# Adaptador de réplicas (patrón)
replica.adapter.endpoint.pattern=tcp -h localhost -p %PORT%

# ===== CONFIGURACIÓN DE BASES DE DATOS =====
# Host de base de datos (si aplica)
database.host=localhost
database.port=5432

# ===== CONFIGURACIÓN DE MONITOREO =====
# Host para servicios de monitoreo
monitoring.host=localhost
monitoring.port=8081 