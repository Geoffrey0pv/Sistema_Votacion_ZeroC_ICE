# ========================================
# CONFIGURACIÓN BROKER NACIONAL
# Sistema de Votación - ZeroC ICE
# ========================================

# ========== CONFIGURACIÓN DE RED ==========
# Host y puerto del broker nacional
broker.host=0.0.0.0
broker.port=9090
broker.endpoints=tcp -h 0.0.0.0 -p 9090

# ========== CONFIGURACIÓN DE RÉPLICAS ==========
# Configuración de réplicas para escalado automático
replica.minReplicas=2
replica.maxReplicas=15
replica.basePort=10000
replica.hostPattern=0.0.0.0
replica.autoScaling=true

# Lista de hosts disponibles para réplicas (separados por coma)
# Ejemplo para múltiples computadores:
# replica.hosts=192.168.1.100,192.168.1.101,192.168.1.102,10.0.0.50,10.0.0.51
replica.hosts=localhost

# ========== CONFIGURACIÓN DE ESCALADO ==========
# Umbrales para escalado automático (porcentajes)
scaling.cpuThreshold=70.0
scaling.memoryThreshold=80.0
scaling.scaleUpThreshold=75.0
scaling.scaleDownThreshold=25.0

# Intervalos de evaluación y enfriamiento (milisegundos)
scaling.evaluationInterval=30000
scaling.cooldownPeriod=60000

# ========== CONFIGURACIÓN DE BALANCEADOR ==========
# Algoritmo de balanceo: ROUND_ROBIN, LEAST_CONNECTIONS, WEIGHTED_ROUND_ROBIN
loadBalancer.algorithm=ROUND_ROBIN
loadBalancer.healthCheckInterval=15000
loadBalancer.maxFailures=3
loadBalancer.failureTimeout=30000

# ========== CONFIGURACIÓN DE MONITOREO ==========
# Intervalos de monitoreo (milisegundos)
monitor.metricsInterval=10000
monitor.resourceCheckInterval=5000
monitor.enableDetailedMetrics=true

# ========== CONFIGURACIÓN DE CLUSTER ==========
# Nombre del cluster nacional
cluster.name=nacional-cluster
cluster.discovery.enabled=true
cluster.discovery.port=7946
cluster.heartbeat.interval=5000

# ========== CONFIGURACIÓN PARA MÚLTIPLES COMPUTADORES ==========
# Configuración de red para despliegue distribuido
network.bindAddress=0.0.0.0
network.publicAddress=auto
network.maxConnections=200
network.connectionTimeout=15000

# Configuración de descubrimiento de nodos
discovery.multicast.enabled=true
discovery.multicast.address=224.0.0.1
discovery.multicast.port=7946
discovery.broadcast.enabled=true
discovery.broadcast.port=7947

# ========== CONFIGURACIÓN DE ALTA DISPONIBILIDAD ==========
# Configuración de failover y recuperación
failover.enabled=true
failover.electionTimeout=15000
failover.leaderHeartbeat=5000
failover.backupNodes=2

# Configuración de persistencia
persistence.enabled=true
persistence.snapshotInterval=300000
persistence.logRetention=86400000

# ========== CONFIGURACIÓN DE SEGURIDAD ==========
# Configuración de seguridad para comunicación entre nodos
security.enabled=false
security.keystore=
security.password=
security.allowedHosts=*

# ========== CONFIGURACIÓN DE RENDIMIENTO ==========
# Configuración de hilos y pools
threading.corePoolSize=10
threading.maxPoolSize=50
threading.queueCapacity=1000
threading.keepAliveTime=60000

# Configuración de cache
cache.enabled=true
cache.maxSize=10000
cache.ttl=300000

# ========== CONFIGURACIÓN DE LOGGING ==========
# Configuración de logs para debugging distribuido
logging.level=INFO
logging.enableDistributedTracing=true
logging.nodeIdInLogs=true
logging.metricsLogging=true 