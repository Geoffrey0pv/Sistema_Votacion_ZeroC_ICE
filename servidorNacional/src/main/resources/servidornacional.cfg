# ========================================
# CONFIGURACIÓN SERVIDOR NACIONAL
# Sistema de Votación - ZeroC ICE
# ========================================

# ========== CONFIGURACIÓN ICE ==========
Ice.Default.Locator=DemoIceGrid/Locator:default -h localhost -p 4061

# Adaptador principal del servidor nacional
ServidorNacionalAdapter.Endpoints=tcp -h localhost -p 9090

# ========== CONFIGURACIÓN BASE DE DATOS ==========
# Configuración PostgreSQL para ConsultaMesa
db.host=x104m01
db.port=5432
db.name=elecciones_grajj
db.user=votaciones_grajj
db.password=votaciones_grajj

# Pool de conexiones
db.pool.minSize=2
db.pool.maxSize=10
db.pool.timeout=30000

# Configuración de reintentos
db.retry.maxAttempts=3
db.retry.delayMs=2000
db.retry.backoffMultiplier=2.0

# ========== CONFIGURACIÓN CONSULTA MESA ==========
# Tiempo de espera para consultas (ms)
consultaMesa.queryTimeout=15000

# Mensaje de servicio inactivo
consultaMesa.serviceInactiveMessage=🚫 SERVICIO TEMPORALMENTE INACTIVO\n   📞 Contacte a soporte técnico\n   📧 soporte@sistemavotacion.gov.co\n   📱 Línea: 01-8000-VOTO (8686)

# ========== CONFIGURACIÓN HELLO WORLD ==========
helloWorld.serverName=Servidor Nacional - Sistema de Votación
helloWorld.version=1.0.0

# ========== CONFIGURACIÓN BROKER ==========
# Configuración del patrón Broker
broker.scalingThreshold=0.5
broker.maxReplicas=5
broker.minReplicas=1

# ========== CONFIGURACIÓN DE LOGGING ==========
# Nivel de logging (DEBUG, INFO, WARN, ERROR)
logging.level=INFO
logging.showTimestamp=true
logging.showThreadName=false

# ========== CONFIGURACIÓN DE MONITOREO ==========
# Intervalo de monitoreo de recursos (ms)
monitor.resourceCheckInterval=5000

# Métricas habilitadas
monitor.enableCpuMetrics=true
monitor.enableMemoryMetrics=true
monitor.enableNetworkMetrics=true

# ========== CONFIGURACIÓN DE SEGURIDAD ==========
# Timeout para conexiones (ms)
security.connectionTimeout=10000

# Máximo número de conexiones concurrentes
security.maxConcurrentConnections=100 