# ========================================
# CONFIGURACIÓN DE CLUSTER DISTRIBUIDO
# Sistema de Votación - ZeroC ICE
# ========================================

# ========== CONFIGURACIÓN DE DESCUBRIMIENTO ==========
# Configuración para descubrimiento automático de nodos
cluster.discovery.enabled=true
cluster.discovery.multicast.address=224.0.0.1
cluster.discovery.multicast.port=7946
cluster.discovery.interval=30000
cluster.discovery.timeout=5000

# ========== CONFIGURACIÓN DE HEARTBEAT ==========
# Configuración de latidos para detectar nodos caídos
cluster.heartbeat.enabled=true
cluster.heartbeat.interval=10000
cluster.heartbeat.timeout=30000
cluster.heartbeat.maxMissed=3

# ========== CONFIGURACIÓN DE RED ==========
# Configuración de red para comunicación entre nodos
cluster.network.bindAddress=0.0.0.0
cluster.network.port=7947
cluster.network.maxConnections=100
cluster.network.connectionTimeout=10000

# ========== CONFIGURACIÓN DE ROLES ==========
# Límites máximos por tipo de nodo
cluster.roles.nacional.maxInstances=3
cluster.roles.regional.maxInstances=20
cluster.roles.mesa.maxInstances=2000

# ========== CONFIGURACIÓN DE FAILOVER ==========
# Configuración de recuperación ante fallos
cluster.failover.enabled=true
cluster.failover.electionTimeout=15000
cluster.failover.leaderHeartbeat=5000

# ========== CONFIGURACIÓN DE SEGURIDAD ==========
# Configuración de seguridad del cluster
cluster.security.enabled=false
cluster.security.keystore=
cluster.security.password=

# ========== NODOS SEMILLA ==========
# Lista de nodos semilla para bootstrap del cluster
# Formato: host:puerto,host:puerto,...
# 
# CONFIGURACIÓN PARA DESARROLLO LOCAL:
cluster.seeds=localhost:7947

# CONFIGURACIÓN PARA MÚLTIPLES COMPUTADORES:
# Descomenta y modifica las siguientes líneas según tu topología de red
#
# EJEMPLO PARA RED LOCAL (192.168.x.x):
# cluster.seeds=192.168.1.100:7947,192.168.1.101:7947,192.168.1.102:7947
#
# EJEMPLO PARA RED CORPORATIVA (10.x.x.x):
# cluster.seeds=10.0.0.50:7947,10.0.0.51:7947,10.0.0.52:7947
#
# EJEMPLO PARA CLOUD/VPS:
# cluster.seeds=203.0.113.10:7947,203.0.113.11:7947,203.0.113.12:7947

# ========== CONFIGURACIÓN DE TOPOLOGÍA ==========
# Configuración específica para diferentes tipos de despliegue

# CONFIGURACIÓN PARA DATACENTER:
# cluster.datacenter.enabled=false
# cluster.datacenter.name=dc1
# cluster.datacenter.rack=rack1

# CONFIGURACIÓN PARA CLOUD:
# cluster.cloud.enabled=false
# cluster.cloud.provider=aws
# cluster.cloud.region=us-east-1
# cluster.cloud.availabilityZone=us-east-1a

# ========== CONFIGURACIÓN DE MONITOREO DISTRIBUIDO ==========
# Configuración para monitoreo del cluster
cluster.monitoring.enabled=true
cluster.monitoring.metricsInterval=30000
cluster.monitoring.healthCheckInterval=15000
cluster.monitoring.nodeStatusBroadcast=true

# ========== CONFIGURACIÓN DE PERSISTENCIA DISTRIBUIDA ==========
# Configuración para persistencia del estado del cluster
cluster.persistence.enabled=true
cluster.persistence.replicationFactor=2
cluster.persistence.syncInterval=60000
cluster.persistence.snapshotInterval=300000

# ========== CONFIGURACIÓN DE BALANCEADOR GLOBAL ==========
# Configuración para balanceo de carga a nivel de cluster
cluster.loadBalancer.enabled=true
cluster.loadBalancer.algorithm=CONSISTENT_HASH
cluster.loadBalancer.healthCheckInterval=20000
cluster.loadBalancer.failoverTimeout=30000

# ========== CONFIGURACIÓN DE COMUNICACIÓN INTER-NODOS ==========
# Configuración para comunicación eficiente entre nodos
cluster.communication.protocol=tcp
cluster.communication.compression=true
cluster.communication.encryption=false
cluster.communication.maxMessageSize=1048576

# ========== CONFIGURACIÓN DE RECURSOS ==========
# Configuración de límites de recursos del cluster
cluster.resources.maxMemoryUsage=80
cluster.resources.maxCpuUsage=75
cluster.resources.maxDiskUsage=85
cluster.resources.alertThreshold=90

# ========== CONFIGURACIÓN DE LOGS DISTRIBUIDOS ==========
# Configuración para logging distribuido
cluster.logging.enabled=true
cluster.logging.level=INFO
cluster.logging.centralizedLogging=false
cluster.logging.logAggregation=false
cluster.logging.nodeIdInLogs=true

# ========== CONFIGURACIÓN DE DESARROLLO/TESTING ==========
# Configuraciones específicas para desarrollo y testing
cluster.development.mode=true
cluster.development.mockNodes=false
cluster.development.simulateNetworkLatency=false
cluster.development.simulateNodeFailures=false

# ========== CONFIGURACIÓN DE PRODUCCIÓN ==========
# Configuraciones específicas para producción
# cluster.production.strictSecurity=true
# cluster.production.auditLogging=true
# cluster.production.performanceMonitoring=true
# cluster.production.alerting.enabled=true
# cluster.production.alerting.email=admin@sistemavotacion.gov.co
# cluster.production.alerting.sms=+57300XXXXXXX

# ========== CONFIGURACIÓN DE BACKUP Y RECUPERACIÓN ==========
# Configuración para backup y recuperación del cluster
cluster.backup.enabled=false
cluster.backup.interval=3600000
cluster.backup.retention=604800000
cluster.backup.location=/var/backups/cluster
cluster.backup.compression=true

# ========== CONFIGURACIÓN DE MÉTRICAS ==========
# Configuración para recolección de métricas del cluster
cluster.metrics.enabled=true
cluster.metrics.collectInterval=10000
cluster.metrics.retentionPeriod=86400000
cluster.metrics.exportFormat=json
cluster.metrics.exportEndpoint=/metrics 