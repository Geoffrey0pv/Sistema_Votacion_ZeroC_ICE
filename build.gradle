//
// Install the gradle Ice Builder plug-in from the plug-in portal
//
plugins {
    id 'com.zeroc.gradle.ice-builder.slice' version '1.4.7' apply false
}

subprojects {
    //
    // Apply Java and Ice Builder plug-ins to all sub-projects
    //
    apply plugin: 'java'
    apply plugin: 'application'
    apply plugin: 'com.zeroc.gradle.ice-builder.slice'

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
 
    //
    // Use Ice JAR files from maven central repository
    //
    repositories {
        mavenCentral()
    }
 
    //
    // Dependencies configuration
    //
    dependencies {
        implementation 'com.zeroc:ice:3.7.9'
        implementation 'com.zeroc:icestorm:3.7.9'
        implementation 'com.zeroc:icegrid:3.7.10'
        implementation 'com.google.code.gson:gson:2.10.1'
        implementation 'com.opencsv:opencsv:5.9'
        implementation 'org.postgresql:postgresql:42.7.1'
        
        // SQLite JDBC para base de datos local en servidor regional
        implementation 'org.xerial:sqlite-jdbc:3.44.1.0'
        
        // Apache POI para manejo de archivos Excel
        implementation 'org.apache.poi:poi:5.2.4'
        implementation 'org.apache.poi:poi-ooxml:5.2.4'
        implementation 'org.apache.poi:poi-ooxml-schemas:4.1.2'
        implementation 'org.apache.xmlbeans:xmlbeans:5.1.1'
        implementation 'org.apache.commons:commons-collections4:4.4'
        implementation 'org.apache.commons:commons-compress:1.21'
        
        // Dependencia específica para webService
        if (project.name == 'webService') {
            implementation project(':servidorNacional')
        }
    }
 
    //
    // Create a JAR file with the appropriate Main-Class and Class-Path attributes
    //
    jar {
        manifest {
            if (project.name == 'webService') {
                attributes(
                    "Main-Class": "WebServiceMain",
                    "Class-Path": configurations.runtimeClasspath.resolve().collect { it.toURI() }.join(' ')
                )
            } else {
                attributes(
                    "Main-Class": project.name.capitalize(),
                    "Class-Path": configurations.runtimeClasspath.resolve().collect { it.toURI() }.join(' ')
                )
            }
        } from {
            configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
        }
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
    
    //
    // Task to print classpath for external scripts
    //
    task printClasspath {
        doLast {
            println configurations.runtimeClasspath.asPath
        }
    }
    
    // Configuración específica para servidorNacional
    if (project.name == 'servidorNacional') {
        //
        // Generar clases ICE desde System.ice
        //
        slice {
            java {
                files = [file("../System.ice")]
            }
        }
        
        application {
            mainClass = 'ServidorNacionalUI.ServidorNacionalUI'
        }
        
        // Configurar la tarea run para que use la clase principal correcta
        run {
            mainClass = 'ServidorNacionalUI.ServidorNacionalUI'
            // Configurar para que funcione con GUI
            systemProperty 'java.awt.headless', 'false'
            // Configurar encoding
            systemProperty 'file.encoding', 'UTF-8'
        }
    }
    
    // Configuración específica para webService
    if (project.name == 'webService') {
        // No generar clases ICE para evitar duplicados
        slice {
            java {
                files = [] // No generar archivos ICE aquí
            }
        }
        
        application {
            mainClass = 'WebServiceMain'
        }
        
        run {
            mainClass = 'WebServiceMain'
            systemProperty 'file.encoding', 'UTF-8'
        }
    }
    
    // Configuración por defecto para otros proyectos
    if (project.name != 'servidorNacional' && project.name != 'webService') {
        //
        // Generar clases ICE desde System.ice para otros proyectos
        //
        slice {
            java {
                files = [file("../System.ice")]
            }
        }
    }
}