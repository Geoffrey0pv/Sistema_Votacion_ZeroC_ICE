#
# Configuración del Servidor Regional
#

# Configuración del adaptador regional
RegionalAdapter.Endpoints=tcp -h localhost -p 8080

# Configuración de IceGrid (opcional)
Ice.Default.Locator=DemoIceGrid/Locator:default -h localhost -p 4061

# Configuración de logging
Ice.Trace.Network=0
Ice.Trace.Protocol=0
Ice.Warn.Connections=1

# Configuración del programa
Ice.ProgramName=ServidorRegional 